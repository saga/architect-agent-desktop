name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  platform-package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-15
          - label: macOS x64
            runner: macos-15-intel
          - label: Windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Wasmer (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl https://get.wasmer.io -sSfL | sh -s "v 7.3.0"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"
      - name: Install Wasmer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iwr https://win.wasmer.io -useb | iex
          $wasmerBin = Join-Path $env:USERPROFILE ".wasmer\bin"
          $env:PATH += ";$wasmerBin"
          $wasmerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build installer and package Rust/WASI runtime
        run: npm run package
      - name: Verify packaged Rust/WASM resources
        shell: bash
        run: node scripts/check-rust-sandbox.mjs
      - name: Report installer size and signing state
        shell: bash
        run: |
          find release -maxdepth 1 -type f -print -exec du -h {} \;
          echo "Unsigned CI artifact: signing/notarization credentials are not configured."
      - uses: actions/upload-artifact@v4
        with:
          name: architect-agent-desktop-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
