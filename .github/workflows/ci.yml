name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:layout:run
  platform-package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-15
          - label: macOS x64
            runner: macos-15-intel
          - label: Windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build installer
        run: npm run package
      - name: Report installer size and signing state
        shell: bash
        run: |
          find release -maxdepth 1 -type f -print -exec du -h {} \;
          echo "Unsigned CI artifact: signing/notarization credentials are not configured."
      - uses: actions/upload-artifact@v4
        with:
          name: architect-agent-desktop-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
