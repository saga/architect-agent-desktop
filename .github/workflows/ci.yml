name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Run Vitest with per-test output
        run: npm test -- --reporter=verbose
        timeout-minutes: 5
      - run: npm run build
      - run: npm run test:layout:run
      - run: npm run test:schedule-browser-session
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --publish never
      - if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: architect-agent-desktop-macOS
          path: |
            release/*.dmg
            release/*-mac.zip
          if-no-files-found: error
          retention-days: 14
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: architect-agent-desktop-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
