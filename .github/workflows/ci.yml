name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  platform-package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-15
          - label: macOS x64
            runner: macos-15-intel
          - label: Windows x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Wasmtime from pinned source
        shell: bash
        run: |
          node scripts/build-wasmtime.mjs --output "$RUNNER_TEMP/wasmtime"
          echo "$RUNNER_TEMP/wasmtime/bin" >> "$GITHUB_PATH"
          echo "WASMTIME_HOME=$RUNNER_TEMP/wasmtime" >> "$GITHUB_ENV"
      - name: Verify Wasmtime build manifest
        shell: bash
        run: |
          cat "$RUNNER_TEMP/wasmtime/build-manifest.json"
      - name: Build installer and package Rust/WASI runtime
        run: npm run package
      - name: Verify packaged resources
        shell: bash
        run: node scripts/check-rust-sandbox.mjs
      - name: Report installer size and signing state
        shell: bash
        run: |
          find release -maxdepth 1 -type f -print -exec du -h {} \;
          echo "Unsigned CI artifact: signing/notarization credentials are not configured."
      - uses: actions/upload-artifact@v4
        with:
          name: architect-agent-desktop-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
