name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:layout:run
      - run: npm run test:schedule-browser-session
      - if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --publish never
      - if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: architect-agent-desktop-${{ runner.os }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
